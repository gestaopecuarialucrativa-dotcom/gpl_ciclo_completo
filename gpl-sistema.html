<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GPL — Gestão Pecuária Lucrativa</title>
<style>
:root{
  --v1:#1B5E20; --v2:#2E7D32; --v3:#4CAF50;
  --escuro:#0F3D2B; --verde-ac:#1D9E75; --mint:#6EE7B7;
  --bg:#eef2ec; --card:#fff; --line:#e0e7e0;
  --txt:#1c2b1e; --mut:#5f6f61; --err:#c62828; --amar:#f9a825;
  --font:Arial,'Segoe UI',Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font);background:var(--bg);color:var(--txt);}
button{font-family:inherit;cursor:pointer;}
.hide{display:none!important;}
svg{flex:none;}

/* ============ LOGIN ============ */
#tela-login{position:fixed;inset:0;background:var(--escuro);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 16px;}
.lg-wrap{width:100%;max-width:420px;}
.lg-logo{text-align:center;margin-bottom:22px;}
.lg-logo img{height:70px;width:auto;}
.lg-sub{color:rgba(255,255,255,.55);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-bottom:20px;}
.lg-box{background:rgba(255,255,255,.07);border:.5px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 16px;margin-bottom:16px;}
.lg-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.lg-sel{width:100%;background:rgba(255,255,255,.1);border:.5px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:15px;padding:11px 12px;-webkit-appearance:none;}
.lg-sel option{color:#000;background:#fff;}
.perfis{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.pcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);transition:.15s;}
.pcard.sel{background:rgba(110,231,183,.12);border-color:var(--mint);}
.pcard-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;}
.ico-v{background:rgba(97,214,117,.18);} .ico-d{background:rgba(255,199,0,.18);} .ico-c{background:rgba(110,172,255,.18);}
.pcard-nome{font-size:15px;font-weight:700;color:#fff;}
.pcard-desc{font-size:11.5px;color:rgba(255,255,255,.45);margin-top:2px;}
.pcard-badge{margin-left:auto;font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap;}
.badge-v{background:rgba(97,214,117,.2);color:#6DD97E;} .badge-d{background:rgba(255,199,0,.2);color:#FFD600;} .badge-c{background:rgba(110,172,255,.2);color:#6EACFF;}
.usr-list{display:flex;flex-direction:column;gap:6px;}
.usr-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid transparent;}
.usr-item.sel{background:rgba(110,231,183,.1);border-color:rgba(110,231,183,.3);}
.usr-av{width:32px;height:32px;border-radius:50%;background:var(--verde-ac);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex:none;}
.usr-n{font-size:13px;font-weight:600;color:#fff;} .usr-c{font-size:10.5px;color:rgba(255,255,255,.4);}
.pin-in{width:100%;background:rgba(255,255,255,.1);border:.5px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:22px;font-weight:800;text-align:center;letter-spacing:10px;padding:12px;}
.pin-in::placeholder{letter-spacing:10px;color:rgba(255,255,255,.25);}
.btn-enter{width:100%;padding:14px;border-radius:12px;background:var(--verde-ac);color:#fff;font-size:15px;font-weight:800;border:none;letter-spacing:.03em;}
.btn-enter:disabled{background:rgba(255,255,255,.15);color:rgba(255,255,255,.35);}
.lg-erro{color:#ff8a80;font-size:12.5px;text-align:center;margin-top:10px;font-weight:700;display:none;}
.lg-link{display:block;text-align:center;font-size:12px;color:rgba(255,255,255,.5);margin-top:16px;background:none;border:none;width:100%;text-decoration:underline;}
.lg-vazio{color:rgba(255,255,255,.4);font-size:12.5px;text-align:center;padding:6px 0;}

/* ============ APP ============ */
#tela-app{display:none;min-height:100vh;}
/* Topbar comum */
.topbar{background:var(--v1);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;}
.topbar img{height:30px;filter:brightness(0) invert(1);}
.tb-tt{font-weight:800;font-size:14px;line-height:1.15;}
.tb-st{font-size:11px;opacity:.85;}
.tb-badge{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;background:rgba(255,255,255,.15);padding:5px 10px;border-radius:20px;}
.tb-badge.pend{background:var(--amar);color:#3a2f00;}
.tb-sair{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;}

/* ---- VAQUEIRO (mobile, botões grandes) ---- */
#shell-vaqueiro{max-width:480px;margin:0 auto;padding:14px;}
.vq-ola{font-size:15px;color:var(--mut);margin:6px 2px 14px;}
.vq-ola b{color:var(--v1);font-size:17px;}
.vq-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.vq-btn{background:#fff;border:1px solid var(--line);border-left:4px solid var(--v2);border-radius:16px;padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
.vq-btn:active{background:#f0f7f0;}
.vq-btn .ic{width:52px;height:52px;border-radius:14px;background:#e8f0e9;display:flex;align-items:center;justify-content:center;}
.vq-btn .nm{font-size:14px;font-weight:800;color:var(--txt);}

/* ---- CONSULTOR / DONO (sidebar) ---- */
#shell-gestao{display:flex;min-height:calc(100vh - 54px);}
.side{width:210px;background:var(--escuro);color:#cfe3d5;flex:none;padding:10px 0;overflow-y:auto;}
.side-sec{font-size:10px;font-weight:800;color:rgba(255,255,255,.35);letter-spacing:.1em;text-transform:uppercase;padding:14px 16px 6px;}
.side-item{display:flex;align-items:center;gap:11px;padding:11px 16px;font-size:14px;font-weight:600;color:rgba(255,255,255,.8);}
.side-item:hover{background:rgba(255,255,255,.05);}
.side-item.on{background:rgba(110,231,183,.14);color:#fff;border-right:3px solid var(--mint);}
.side-item svg{stroke:currentColor;}
.conteudo{flex:1;padding:18px;overflow-x:hidden;}
.pg{display:none;} .pg.on{display:block;}
.pg-tt{font-size:20px;font-weight:800;color:var(--v1);margin-bottom:2px;}
.pg-sub{font-size:13px;color:var(--mut);margin-bottom:16px;}

/* menu mobile p/ gestão */
.side-toggle{display:none;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;padding:6px 9px;}
@media(max-width:760px){
  #shell-gestao{display:block;}
  .side{position:fixed;left:0;top:54px;bottom:0;z-index:60;transform:translateX(-100%);transition:.2s;box-shadow:4px 0 18px rgba(0,0,0,.25);}
  .side.open{transform:translateX(0);}
  .side-toggle{display:flex;}
  .conteudo{padding:14px;}
  .side-bg{display:none;position:fixed;inset:0;top:54px;background:rgba(0,0,0,.4);z-index:55;}
  .side-bg.open{display:block;}
}

/* estado "em construção" das telas de módulo */
.mod-vazio{background:#fff;border:1px dashed #cfe0d0;border-radius:14px;padding:30px 20px;text-align:center;color:var(--mut);}
.mod-vazio svg{stroke:var(--v3);margin-bottom:10px;}
.mod-vazio b{color:var(--v1);display:block;font-size:16px;margin-bottom:4px;}
.mod-vazio span{font-size:13px;}

/* card genérico */
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--v2);border-radius:14px;padding:14px;margin-bottom:12px;}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 5px;}
input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff;}
input:focus,select:focus{outline:none;border-color:var(--v3);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--v3);color:#fff;font-weight:800;font-size:15px;border:none;border-radius:12px;padding:13px;margin-top:12px;}
.btn.sec{background:#fff;color:var(--v2);border:1.5px solid var(--v2);}
.btn.mini{width:auto;padding:9px 13px;font-size:13px;margin-top:0;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;background:#e3f2e4;color:var(--v1);}
.lista-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--v2);border-radius:12px;padding:11px 12px;margin-top:8px;}
.lista-item .av{width:36px;height:36px;border-radius:50%;background:#e8f0e9;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--v2);flex:none;}
.li-n{font-weight:800;font-size:14px;} .li-s{font-size:12px;color:var(--mut);}
.li-x{margin-left:auto;background:none;border:1px solid #ffcdd2;color:var(--err);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;}
.ok-msg{display:none;background:#e3f2e4;color:var(--v1);font-weight:800;text-align:center;border-radius:12px;padding:11px;margin-top:10px;}
.err-msg{display:none;background:#fdecea;color:var(--err);font-weight:700;font-size:13px;text-align:center;border-radius:12px;padding:10px;margin-top:8px;}
.voltar{display:inline-flex;align-items:center;gap:6px;color:var(--v2);font-weight:800;font-size:14px;background:none;border:none;padding:4px 0;margin-bottom:10px;cursor:pointer;}
.grp3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px;}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;font-weight:700;color:var(--mut);background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;}
.opt.sel{border-color:var(--v2);color:var(--v1);background:#f0f7f0;}
.rec-box{background:#fffde7;border:1px solid #f0e6a0;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px;color:#5d4f00;display:none;}
.pan-bloco{background:#fff;border:0.5px solid var(--line);border-left:4px solid var(--v2);border-radius:0;padding:14px;margin-bottom:12px;}
.pan-bloco.amarelo{border-left-color:var(--amar);}
.pan-tt{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pan-tt span{font-size:15px;font-weight:800;color:var(--txt);}
.pan-badge{margin-left:auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;}
.pan-badge.am{background:#FAEEDA;color:#854F0B;} .pan-badge.vd{background:#EAF3DE;color:#27500A;} .pan-badge.gz{background:#f1efe8;color:#5f6f61;}
.lan-row{display:flex;align-items:center;padding:9px 0;border-top:0.5px solid var(--line);}
.lan-row .lt{flex:1;} .lan-row .ln{font-size:14px;font-weight:700;} .lan-row .ld{font-size:12px;color:var(--mut);}
.lan-row .lh{font-size:12px;color:var(--mut);margin-right:10px;}
.lan-aprov{font-size:12px;font-weight:700;color:var(--v2);border:0.5px solid var(--v2);border-radius:8px;padding:5px 10px;background:none;cursor:pointer;}
.lan-rej{font-size:12px;color:#993c1d;border:0.5px solid #f0997b;border-radius:8px;padding:5px 10px;background:none;cursor:pointer;margin-left:6px;}
.eq-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:0.5px solid var(--line);}
.eq-av{width:34px;height:34px;border-radius:50%;background:#e8f0e9;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--v2);flex:none;font-size:15px;}
.eq-n{font-size:14px;font-weight:700;} .eq-s{font-size:12px;color:var(--mut);}
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="tela-login">
  <div class="lg-wrap">
    <div class="lg-logo"><img id="lg-logo-img" alt="GPL"></div>
    <div class="lg-sub">Gestão Pecuária Lucrativa</div>

    <div class="lg-box">
      <div class="lg-lbl">Fazenda</div>
      <select class="lg-sel" id="lg-faz" onchange="lgFaz()"></select>
    </div>

    <div id="lg-apos-faz" class="hide">
      <div class="lg-lbl" style="margin-bottom:10px;">Tipo de acesso</div>
      <div class="perfis" id="lg-perfis"></div>

      <div class="lg-box" id="lg-usr-box">
        <div class="lg-lbl">Usuário</div>
        <div class="usr-list" id="lg-usr-list"></div>
      </div>

      <div class="lg-box">
        <div class="lg-lbl">PIN</div>
        <input class="pin-in" id="lg-pin" inputmode="numeric" maxlength="4" placeholder="••••" onkeydown="if(event.key==='Enter'){event.preventDefault();entrar();}">
      </div>

      <button class="btn-enter" id="lg-btn" onclick="entrar()" disabled>Entrar</button>
      <div class="lg-erro" id="lg-erro"></div>
    </div>

    <button class="lg-link" onclick="abrirCadastroFaz()">+ Criar nova fazenda / cadastrar usuários</button>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="tela-app">
  <div class="topbar">
    <button class="side-toggle" id="btn-toggle" onclick="toggleSide()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <img id="tb-logo" alt="GPL">
    <div><div class="tb-tt" id="tb-faz">GPL</div><div class="tb-st" id="tb-usr"></div></div>
    <div class="tb-badge" id="tb-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 19a4.5 4.5 0 1 1 .42-8.98 6 6 0 1 1 11.58 2.1A3.5 3.5 0 0 1 17.5 19z"/></svg>
      <span id="tb-badge-txt">Nuvem</span>
    </div>
    <button class="tb-sair" onclick="sair()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Sair
    </button>
  </div>

  <!-- ---- SHELL VAQUEIRO ---- -->
  <div id="shell-vaqueiro" class="hide">
    <div id="vq-home">
      <div class="vq-ola">Olá, <b id="vq-nome"></b>. O que vamos lançar?</div>
      <div class="vq-grid" id="vq-grid"></div>
      <div style="margin:14px;background:#fff;border:0.5px solid var(--line);border-radius:12px;overflow:hidden;">
        <div style="padding:10px 14px;border-bottom:0.5px solid var(--line);font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;">Últimos lançamentos do dia</div>
        <div id="vq-ultimos"><div style="padding:12px 14px;font-size:13px;color:var(--mut);text-align:center;">Nenhum lançamento hoje.</div></div>
      </div>
    </div>
    <!-- TRATO DE COCHO -->
    <div id="vq-trato" class="hide" style="padding:14px;">
      <button class="voltar" onclick="vqHome()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Voltar
      </button>
      <div style="font-size:18px;font-weight:800;color:var(--v1);">Trato de Cocho</div>
      <div style="font-size:13px;color:var(--mut);margin-bottom:12px;" id="tr-sub">Safra 2026/2027</div>
      <div class="card">
        <div class="row2"><div><label>Data</label><input id="tr-data" type="date"></div><div><label>Lote</label><select id="tr-lote"><option value="">Selecione...</option></select></div></div>
        <label>Produto</label>
        <select id="tr-prod"><option value="">Selecione o produto...</option></select>
        <label>Quantidade (sacos de 30 kg)</label>
        <input id="tr-qtd" inputmode="decimal" placeholder="Ex.: 2,5" oninput="trCalcRec()">
        <div class="rec-box" id="tr-rec"></div>
        <label>Situação do cocho</label>
        <div class="grp3" id="tr-cocho">
          <div class="opt" onclick="selOpt(this,'tr-cocho')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-2 8H5z"/></svg>Vazio</div>
          <div class="opt" onclick="selOpt(this,'tr-cocho')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-2 8H5z"/><line x1="6" y1="14" x2="18" y2="14"/></svg>Baixo</div>
          <div class="opt" onclick="selOpt(this,'tr-cocho')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-2 8H5z"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="6" y1="15" x2="18" y2="15"/></svg>Médio</div>
        </div>
        <label>Observação</label>
        <input id="tr-obs" placeholder="Opcional">
        <button class="btn" onclick="envTrato()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14L21 3"/><path d="M21 3l-6.5 18-3.5-7-7-3.5z"/></svg>Enviar trato
        </button>
        <div class="ok-msg" id="ok-tr">Trato enviado</div>
        <div class="err-msg" id="err-tr"></div>
      </div>
    </div>
    <!-- MUDA DE PASTO -->
    <div id="vq-muda" class="hide" style="padding:14px;">
      <button class="voltar" onclick="vqHome()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Voltar
      </button>
      <div style="font-size:18px;font-weight:800;color:var(--v1);">Muda de Pasto</div>
      <div style="font-size:13px;color:var(--mut);margin-bottom:12px;">Safra 2026/2027</div>
      <div class="card">
        <div class="row2"><div><label>Data</label><input id="mu-data" type="date"></div><div><label>Lote</label><select id="mu-lote"><option value="">Selecione...</option></select></div></div>
        <label>Área / Piquete de origem</label>
        <input id="mu-orig" placeholder="Ex.: P08 ou Módulo 01/Piquete 02">
        <label>Área / Piquete de destino</label>
        <input id="mu-dest" placeholder="Ex.: P09 ou Módulo 01/Piquete 03">
        <label>Observação</label>
        <input id="mu-obs" placeholder="Opcional">
        <button class="btn" onclick="envMuda()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h14"/><path d="M13 8l4 4-4 4"/><path d="M21 5v14"/></svg>Confirmar mudança
        </button>
        <div class="ok-msg" id="ok-mu">Muda registrada</div>
        <div class="err-msg" id="err-mu"></div>
      </div>
    </div>
  </div>

  <!-- ---- SHELL GESTÃO (consultor/dono) ---- -->
  <div id="shell-gestao" class="hide">
    <div class="side-bg" id="side-bg" onclick="toggleSide()"></div>
    <nav class="side" id="side"></nav>
    <div class="conteudo" id="conteudo"></div>
  </div>
</div>

<script>
/* ================= CONFIG NUVEM ================= */
/* Quando o backend novo estiver pronto, cole aqui a URL /exec do Apps Script.
   Enquanto estiver vazio, o sistema guarda localmente e mostra "Nuvem: configurar". */
var API_URL = 'https://script.google.com/macros/s/AKfycbx7P8d6CjwoTkiMr2glnHPUWzIPisOZ9qtvtC9ug2R_u6ThlYX7fb7ICuzXu8JOOWocHA/exec';

/* ================= ÍCONES SVG ================= */
var IC = {

  document.getElementById('tela-login').style.display='none';

  document.getElementById('tb-faz').textContent=FAZ_ATUAL;
  document.getElementById('tb-usr').textContent=CU.nome+' — '+CU.funcao;

  else { abrirGestao(); }
}
/* Carrega lançamentos da planilha própria da fazenda (nuvem) */
function carregarFaz(){
  if(!API_URL) return;
  var f=DB.fazendas[FAZ_ATUAL]||{};
  if(!f.slug){ registrarFazNaNuvem(FAZ_ATUAL); return; } // ainda não está na nuvem
  var chave=f.slug;
  fetch(API_URL+'?action=boot&faz='+encodeURIComponent(chave)).then(function(r){return r.json();}).then(function(j){
    if(j&&j.ok){
      if(!DB.fazendas[FAZ_ATUAL]) DB.fazendas[FAZ_ATUAL]={usuarios:[]};
      if(j.slug) DB.fazendas[FAZ_ATUAL].slug=j.slug;
      DB.fazendas[FAZ_ATUAL].lancamentos=j.lancamentos||[];
      salvarDB();
      if(CU.funcao!=='Vaqueiro'){ var mi=document.getElementById('mi-painel'); if(mi&&mi.classList.contains('on')) navGestao('painel'); }
    }
  }).catch(function(){});
}

function trCalcRec(){

  var parts=sel.split('|'); var pct=parseFloat(parts[0]); var kg30=parseInt(parts[1])||30;

function envTrato(){
  var err=document.getElementById('err-tr');

  var lote=document.getElementById('tr-lote').value;
  var prod=document.getElementById('tr-prod'); var prodNome=prod.options[prod.selectedIndex]?prod.options[prod.selectedIndex].text:'';
  var qtd=numBR(document.getElementById('tr-qtd').value);
  if(!lote){err.textContent='Selecione o lote.';err.style.display='block';return;}
  if(!prodNome||prodNome==='Selecione o produto...'){err.textContent='Selecione o produto.';err.style.display='block';return;}
  if(qtd<=0){err.textContent='Informe a quantidade em sacos.';err.style.display='block';return;}
  var reg={action:'trato',id:'L'+Date.now()+Math.floor(Math.random()*1000),faz:FAZ_ATUAL,n:CU.nome,dt:document.getElementById('tr-data').value,lote:lote,prod:prodNome,qtd:qtd,kg:qtd*30,sit:cochSel(),obs:document.getElementById('tr-obs').value.trim(),ts:new Date().toISOString()};
  nuvem(reg);
  addUlt(reg);
  document.getElementById('ok-tr').style.display='block';
  setTimeout(function(){document.getElementById('ok-tr').style.display='none';vqHome();},1400);
}

  if(!orig||!dest){err.textContent='Informe a origem e o destino.';err.style.display='block';return;}
  var reg={action:'mudanca',id:'L'+Date.now()+Math.floor(Math.random()*1000),faz:FAZ_ATUAL,n:CU.nome,dt:document.getElementById('mu-data').value,lote:lote,origem:orig,destino:dest,obs:document.getElementById('mu-obs').value.trim(),ts:new Date().toISOString()};
  nuvem(reg);
  addUlt(reg);
  document.getElementById('ok-mu').style.display='block';
  setTimeout(function(){document.getElementById('ok-mu').style.display='none';vqHome();},1400);
}
var _ult=[];
function addUlt(r){
  var hora=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  _ult.unshift({tipo:r.action,lote:r.lote,det:r.action==='trato'?r.qtd+' sacos · '+r.prod:r.origem+' → '+r.dest||r.destino,hora:hora,status:'Enviando'});
  renderUlt();
}
function renderUlt(){
  var el=document.getElementById('vq-ultimos'); if(!el)return;
  if(!_ult.length){el.innerHTML='<div style="padding:12px 14px;font-size:13px;color:var(--mut);text-align:center;">Nenhum lançamento hoje.</div>';return;}
  el.innerHTML=_ult.slice(0,5).map(function(u){
    var cor=u.status==='Enviando'?'background:#FAEEDA;color:#854F0B':'background:#EAF3DE;color:#27500A';
    return '<div style="display:flex;align-items:center;padding:10px 14px;border-top:0.5px solid var(--line);">'
      +'<div style="flex:1;"><div style="font-size:13px;font-weight:700;">'+(u.tipo==='trato'?'Trato':'Muda de pasto')+' — '+u.lote+'</div><div style="font-size:12px;color:var(--mut);">'+u.det+'</div></div>'
      +'<div style="text-align:right;"><div style="font-size:12px;color:var(--mut);margin-bottom:3px;">'+u.hora+'</div>'
      +'<span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;'+cor+'">'+u.status+'</span></div></div>';
  }).join('');
}

function registrarFazNaNuvem(faz){
  var f=DB.fazendas[faz]; if(!f||!API_URL) return;
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'fazenda',nome:faz})})
    .then(function(r){return r.json();}).then(function(j){
      if(j&&j.ok&&j.slug){
        f.slug=j.slug; salvarDB();
        (f.usuarios||[]).forEach(function(u){ nuvem({action:'usuario',fazenda:faz,nome:u.nome,funcao:u.funcao,pin:u.pin}); });
        carregarFaz();
      }
    }).catch(function(){});
}
function renderPainel(){
  var hoje=hojeISO();
  var db=DB.fazendas[FAZ_ATUAL]||{};
  var lans=(db.lancamentos||[]).filter(function(r){return r.dt===hoje&&!r._apagado;}).sort(function(a,b){return b.ts>a.ts?1:-1;});
  var pend=lans.filter(function(r){return !r._aprov;});
  var users=db.usuarios||[];
  var h='<div class="pg-tt">Central do dia</div><div class="pg-sub">'+FAZ_ATUAL+' · '+new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})+'</div>';
  // Bloco atenção
  h+='<div class="pan-bloco amarelo"><div class="pan-tt">'
    +'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#854F0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
    +'<span>Precisa da sua atenção</span>'
    +(pend.length?'<span class="pan-badge am">'+pend.length+' pendente'+(pend.length>1?'s':'')+'</span>':'<span class="pan-badge vd">Em dia</span>')
    +'</div>';
  if(pend.length){
    pend.slice(0,5).forEach(function(r,i){
      var tt=r.action==='trato'?'Trato — '+r.lote:'Muda de pasto — '+r.lote;
      var det=r.action==='trato'?r.qtd+' sacos · '+r.prod:r.origem+' → '+(r.destino||r.dest);
      h+='<div class="lan-row"><div class="lt"><div class="ln">'+tt+'</div><div class="ld">'+det+' · '+r.n+'</div></div>'
        +'<button class="lan-aprov" onclick="aprov(\''+r.id+'\')">Aprovar</button>'
        +'<button class="lan-rej"   onclick="rejeit(\''+r.id+'\')">Rejeitar</button></div>';
    });
  } else {
    h+='<div style="font-size:13px;color:var(--mut);padding:8px 0;">Nenhum lançamento aguardando aprovação.</div>';
  }
  h+='</div>';
  // Bloco lançado hoje
  h+='<div class="pan-bloco"><div class="pan-tt">'
    +'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--v2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'
    +'<span>Lançado hoje</span><span class="pan-badge gz">'+lans.length+'</span></div>';
  if(lans.length){
    lans.slice(0,8).forEach(function(r){
      var tt=r.action==='trato'?'Trato — '+r.lote:'Muda — '+r.lote;
      var det=r.action==='trato'?r.qtd+' sacos':r.origem+' → '+(r.destino||r.dest);
      var hora=r.ts?new Date(r.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'--:--';
      var cor=r._aprov?'background:#EAF3DE;color:#27500A':'background:#FAEEDA;color:#854F0B';
      h+='<div class="lan-row"><div class="lt"><div class="ln">'+tt+'</div><div class="ld">'+det+'</div></div>'
        +'<span class="lh">'+hora+'</span>'
        +'<span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;'+cor+'">'+(r._aprov?'Aprovado':'Pendente')+'</span></div>';
    });
  } else {
    h+='<div style="font-size:13px;color:var(--mut);padding:8px 0;">Nenhum lançamento hoje.</div>';
  }
  h+='</div>';
  // Equipe
  h+='<div class="pan-bloco"><div class="pan-tt">'
    +'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--v2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5"/><path d="M16 5.5a3 3 0 0 1 0 5.5"/><path d="M18 20c0-2-.8-3.5-2-4.3"/></svg>'
    +'<span>Equipe em campo hoje</span></div>';
  var vaqueiros=users.filter(function(u){return u.funcao==='Vaqueiro';});
  if(vaqueiros.length){
    vaqueiros.forEach(function(u){
      var count=lans.filter(function(r){return r.n===u.nome;}).length;
      var ativo=count>0;
      h+='<div class="eq-row"><div class="eq-av">'+u.nome.charAt(0).toUpperCase()+'</div>'
        +'<div style="flex:1;"><div class="eq-n">'+u.nome+'</div><div class="eq-s">'+(ativo?count+' lançamento'+(count>1?'s':''):'Sem lançamento hoje')+'</div></div>'
        +'<span class="pan-badge '+(ativo?'vd':'gz')+'">'+(ativo?'Ativo':'Inativo')+'</span></div>';
    });
  } else {
    h+='<div style="font-size:13px;color:var(--mut);padding:8px 0;">Nenhum vaqueiro cadastrado.</div>';
  }
  h+='</div>';
  return h;
}
function aprov(id){
  var db=DB.fazendas[FAZ_ATUAL]||{}; var lans=db.lancamentos||[];
  lans.forEach(function(r){if(r.id===id) r._aprov=true;});
  salvarDB(); navGestao('painel');
  nuvem({action:'aprov',faz:FAZ_ATUAL,id:id,n:CU.nome});
}
function rejeit(id){
  if(!confirm('Rejeitar este lançamento?')) return;
  var db=DB.fazendas[FAZ_ATUAL]||{}; var lans=db.lancamentos||[];
  lans.forEach(function(r){if(r.id===id) r._apagado=true;});
  salvarDB(); navGestao('painel');
  nuvem({action:'rejeitar',faz:FAZ_ATUAL,id:id,n:CU.nome});
}
function conteudoModulo(id){
  if(id==='usuarios') return blocoUsuarios();
  if(id==='painel')   return renderPainel();
  var nome=NOMES_MOD[id]||id;
  return '<div class="pg-tt">'+nome+'</div><div class="pg-sub">'+FAZ_ATUAL+'</div>'
    +'<div class="mod-vazio">'
    +'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--v3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/></svg>'
    +'<b>Módulo pronto para ser ligado</b>'
    +'<span>Esta é a base do sistema. O módulo <b>'+nome+'</b> entra aqui na próxima etapa, já salvando na planilha.</span>'
    +'</div>';
}

/* ---- USUÁRIOS E FAZENDAS (funcional na base) ---- */
function blocoUsuarios(){
  return '<div class="pg-tt">Usuários e Fazendas</div><div class="pg-sub">Cadastre fazendas e quem acessa cada uma</div>'
  +'<div class="card"><div style="font-weight:800;color:var(--v1);margin-bottom:4px;">Nova fazenda</div>'
  +'<label>Nome da fazenda</label><input id="cf-nome" placeholder="Ex.: Fazenda Boa Vista">'
  +'<button class="btn" onclick="criarFaz()">Criar fazenda</button></div>'
  +'<div class="card"><div style="font-weight:800;color:var(--v1);margin-bottom:4px;">Novo usuário</div>'
  +'<label>Fazenda</label><select id="cu-faz"></select>'
  +'<div class="row2"><div><label>Nome</label><input id="cu-nome" placeholder="Ex.: Fábio"></div>'
  +'<div><label>Função</label><select id="cu-func"><option>Vaqueiro</option><option>Dono</option><option>Consultor</option></select></div></div>'
  +'<label>PIN (4 dígitos)</label><input id="cu-pin" inputmode="numeric" maxlength="4" placeholder="0000">'
  +'<button class="btn" onclick="criarUsr()">Cadastrar usuário</button>'
  +'<div class="ok-msg" id="ok-usr">Salvo</div></div>'
  +'<div id="lista-usuarios"></div>';
}
function renderUsuarios(){
  var selF=document.getElementById('cu-faz');
  if(selF) selF.innerHTML=Object.keys(DB.fazendas).map(function(n){return '<option>'+n+'</option>';}).join('');
  var alvo=document.getElementById('lista-usuarios'); if(!alvo) return;
  var h='';
  Object.keys(DB.fazendas).forEach(function(faz){
    h+='<div class="card" style="border-left-color:var(--v1)"><div style="font-weight:800;color:var(--v1);display:flex;align-items:center;gap:8px;margin-bottom:4px;">'+IC.mapa+' '+faz+'</div>';
    var us=DB.fazendas[faz].usuarios||[];
    if(!us.length){ h+='<div class="li-s">Nenhum usuário.</div>'; }
    us.forEach(function(u,i){
      h+='<div class="lista-item"><div class="av">'+u.nome.charAt(0).toUpperCase()+'</div>'
        +'<div><div class="li-n">'+u.nome+'</div><div class="li-s">'+u.funcao+' · PIN '+u.pin+'</div></div>'
        +'<button class="li-x" onclick="delUsr(\''+faz.replace(/'/g,"\\'")+'\','+i+')">Remover</button></div>';
    });
    h+='</div>';
  });
  alvo.innerHTML=h;
}
function criarFaz(){
  var n=(document.getElementById('cf-nome').value||'').trim();
  if(!n){ alert('Digite o nome da fazenda.'); return; }
  if(DB.fazendas[n]){ alert('Já existe uma fazenda com esse nome.'); return; }
  DB.fazendas[n]={usuarios:[]}; 
  // o consultor que criou já entra como usuário da fazenda nova
  if(CU && CU.funcao==='Consultor'){
    DB.fazendas[n].usuarios.push({nome:CU.nome,funcao:'Consultor',pin:CU.pin});
  }
  salvarDB();
  document.getElementById('cf-nome').value='';
  if(API_URL){
    fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'fazenda',nome:n})})
      .then(function(r){return r.json();}).then(function(j){
        if(j&&j.ok&&j.slug){ DB.fazendas[n].slug=j.slug; salvarDB(); }
        if(CU && CU.funcao==='Consultor'){ nuvem({action:'usuario',fazenda:n,nome:CU.nome,funcao:'Consultor',pin:CU.pin}); }
        renderUsuarios();
      }).catch(function(){ nuvem({action:'fazenda',nome:n}); });
  }
  renderUsuarios();
}
function criarUsr(){
  var faz=document.getElementById('cu-faz').value;
  var nome=(document.getElementById('cu-nome').value||'').trim();
  var func=document.getElementById('cu-func').value;
  var pin=(document.getElementById('cu-pin').value||'').trim();
  if(!faz||!nome||pin.length!==4){ alert('Preencha nome e PIN de 4 dígitos.'); return; }
  DB.fazendas[faz].usuarios.push({nome:nome,funcao:func,pin:pin}); salvarDB();
  document.getElementById('cu-nome').value=''; document.getElementById('cu-pin').value='';
  nuvem({action:'usuario', fazenda:faz, nome:nome, funcao:func, pin:pin});
  var ok=document.getElementById('ok-usr'); ok.style.display='block'; setTimeout(function(){ok.style.display='none';},1400);
  renderUsuarios();
}
function delUsr(faz,i){
  if(!confirm('Remover este usuário?')) return;
  var u=DB.fazendas[faz].usuarios[i];
  DB.fazendas[faz].usuarios.splice(i,1); salvarDB();
  if(u) nuvem({action:'usuario_del', fazenda:faz, nome:u.nome, funcao:u.funcao});
  renderUsuarios();
}

/* ================= NUVEM (backend novo — Apps Script) ================= */
var FILA_KEY='gpl_sis_fila';
function lerFila(){ try{return JSON.parse(localStorage.getItem(FILA_KEY)||'[]');}catch(e){return [];} }
function guardarFila(reg){ var f=lerFila(); f.push(reg); localStorage.setItem(FILA_KEY,JSON.stringify(f)); }
function nuvem(reg){
  // salvar localmente antes (painel lê do DB local; não depende da nuvem)
  if(reg.action==='trato'||reg.action==='mudanca'){
    var faz=reg.faz||FAZ_ATUAL;
    if(DB.fazendas[faz]){
      if(!DB.fazendas[faz].lancamentos) DB.fazendas[faz].lancamentos=[];
      DB.fazendas[faz].lancamentos.push(reg);
      salvarDB();
    }
  }
  if(!API_URL){ attBadge(); return; }
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(reg)})
    .then(function(r){return r.json();})
    .then(function(j){ if(!(j&&j.ok)) throw new Error('resp'); attBadge(); })
    .catch(function(){ guardarFila(reg); attBadge(); });
}
function tentarFila(){
  if(!API_URL) return;
  var f=lerFila(); if(!f.length){ attBadge(); return; }
  localStorage.setItem(FILA_KEY,'[]'); attBadge();
  f.forEach(function(reg){ nuvem(reg); });
}
window.addEventListener('online',tentarFila);

/* Carrega fazendas/usuários da nuvem ao abrir — funciona em qualquer aparelho */
function bootNuvem(){
  if(!API_URL){ attBadge(); return; }
  fetch(API_URL+'?action=boot').then(function(r){return r.json();}).then(function(j){
    if(j&&j.ok&&j.fazendas){
      Object.keys(j.fazendas).forEach(function(f){
        if(!DB.fazendas[f]) DB.fazendas[f]={usuarios:[]};
        if(j.fazendas[f].slug) DB.fazendas[f].slug=j.fazendas[f].slug;
        (j.fazendas[f].usuarios||[]).forEach(function(cu){
          var ex=null;
          DB.fazendas[f].usuarios.forEach(function(u){ if(u.nome===cu.nome&&u.funcao===cu.funcao) ex=u; });
          if(ex){ ex.pin=cu.pin; } else { DB.fazendas[f].usuarios.push({nome:cu.nome,funcao:cu.funcao,pin:cu.pin}); }
        });
      });
      salvarDB(); montarFaz();
    }
    tentarFila();
  }).catch(function(){ attBadge(); });
}
function attBadge(){
  var t=document.getElementById('tb-badge-txt'), b=document.getElementById('tb-badge');
  if(!b) return;
  if(!API_URL){ b.classList.add('pend'); t.textContent='Nuvem: configurar'; return; }
  var n=lerFila().length;
  if(n>0){ b.classList.add('pend'); t.textContent=n+' na fila'; }
  else{ b.classList.remove('pend'); t.textContent='Nuvem'; }
}
